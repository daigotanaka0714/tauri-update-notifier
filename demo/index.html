<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tauri-update-notifier Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        min-height: 100vh;
        color: #e1e1e6;
      }
      .demo-container {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        color: #fff;
      }
      .subtitle {
        color: #a1a1aa;
        margin-bottom: 2rem;
      }
      .mock-app {
        background: #0d0d14;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2rem;
        min-height: 400px;
        position: relative;
      }
      .mock-app h2 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }
      .mock-content {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .mock-card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        padding: 1rem;
      }
      .mock-card h3 {
        font-size: 0.875rem;
        color: #a1a1aa;
        margin-bottom: 0.5rem;
      }
      .mock-card p {
        font-size: 0.75rem;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo/main.tsx"></script>
  </body>
</html>
